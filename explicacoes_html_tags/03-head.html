<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia HTML - <head></title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        h1 { color: #1f2937; }
        h2 { margin-top: 30px; color: #374151; }
        code, pre { background: #f3f4f6; padding: 3px 6px; border-radius: 4px; }
        pre { padding: 15px; overflow-x: auto; }
        .box { background: #eef6ff; padding: 15px; border-left: 4px solid #2563eb; }
    </style>
</head>
<body>
<h1>TAG <code><head></code></h1>
<div class="box"><strong>O que é?</strong><br>Contém configurações e informações da página que não são o conteúdo principal visível.</div>

<h2>Explicação</h2>
<div>Dentro do head ficam elementos como meta, title e link para o CSS.<br><br>Exemplo:<br>&lt;head&gt;<br>    ...<br>&lt;/head&gt;<br><br>Não coloque o conteúdo principal do site dentro do head.</div>
</body>
</html>
