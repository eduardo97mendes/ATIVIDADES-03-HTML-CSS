<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia HTML - <h1></title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        h1 { color: #1f2937; }
        h2 { margin-top: 30px; color: #374151; }
        code, pre { background: #f3f4f6; padding: 3px 6px; border-radius: 4px; }
        pre { padding: 15px; overflow-x: auto; }
        .box { background: #eef6ff; padding: 15px; border-left: 4px solid #2563eb; }
    </style>
</head>
<body>
<h1>TAG <code><h1></code></h1>
<div class="box"><strong>O que é?</strong><br>Representa o título principal da página.</div>

<h2>Explicação</h2>
<div>Exemplos:<br>Cuidando do seu melhor amigo<br>Supere seus limites<br>Seu estilo começa aqui<br>Sabor que reúne pessoas<br>Tecnologia para facilitar sua vida<br><br>Estrutura:<br>&lt;h1&gt;Título principal&lt;/h1&gt;<br><br>Crie um título relacionado ao tema escolhido.</div>
</body>
</html>
