<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia HTML - <textarea></title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        h1 { color: #1f2937; }
        h2 { margin-top: 30px; color: #374151; }
        code, pre { background: #f3f4f6; padding: 3px 6px; border-radius: 4px; }
        pre { padding: 15px; overflow-x: auto; }
        .box { background: #eef6ff; padding: 15px; border-left: 4px solid #2563eb; }
    </style>
</head>
<body>
<h1>TAG <code><textarea></code></h1>
<div class="box"><strong>O que é?</strong><br>Cria uma área maior para o usuário escrever uma mensagem.</div>

<h2>Explicação</h2>
<div>Exemplo:<br>&lt;textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite sua mensagem"&gt;&lt;/textarea&gt;<br><br>rows define aproximadamente a altura inicial.<br><br>Exemplos:<br>rows="3"<br>rows="5"<br>rows="6"<br>rows="8"<br><br>Para a atividade, rows="5" é uma boa opção.<br><br>Placeholder:<br>Digite sua mensagem<br>Conte como podemos ajudar<br>Escreva sua dúvida</div>
</body>
</html>
