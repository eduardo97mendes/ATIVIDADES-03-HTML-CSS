<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia HTML - <div></title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        h1 { color: #1f2937; }
        h2 { margin-top: 30px; color: #374151; }
        code, pre { background: #f3f4f6; padding: 3px 6px; border-radius: 4px; }
        pre { padding: 15px; overflow-x: auto; }
        .box { background: #eef6ff; padding: 15px; border-left: 4px solid #2563eb; }
    </style>
</head>
<body>
<h1>TAG <code><div></code></h1>
<div class="box"><strong>O que é?</strong><br>Agrupa elementos para organizar a estrutura e permitir estilização com CSS.</div>

<h2>Explicação</h2>
<div>Exemplo:<br>&lt;div class="card-content"&gt;<br>    &lt;h3&gt;Banho e Tosa&lt;/h3&gt;<br>    &lt;p&gt;Descrição do serviço.&lt;/p&gt;<br>&lt;/div&gt;<br><br>Não é uma tag de conteúdo específico; serve principalmente para agrupamento.</div>
</body>
</html>
