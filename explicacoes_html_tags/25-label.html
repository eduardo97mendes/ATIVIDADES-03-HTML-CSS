<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia HTML - <label></title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        h1 { color: #1f2937; }
        h2 { margin-top: 30px; color: #374151; }
        code, pre { background: #f3f4f6; padding: 3px 6px; border-radius: 4px; }
        pre { padding: 15px; overflow-x: auto; }
        .box { background: #eef6ff; padding: 15px; border-left: 4px solid #2563eb; }
    </style>
</head>
<body>
<h1>TAG <code><label></code></h1>
<div class="box"><strong>O que é?</strong><br>Identifica um campo do formulário.</div>

<h2>Explicação</h2>
<div>Estrutura:<br>&lt;label for="nome"&gt;Nome&lt;/label&gt;<br><br>O valor de for deve corresponder ao id do campo.<br><br>Exemplo:<br>for="nome"<br>id="nome"<br><br>Textos possíveis:<br>Nome<br>E-mail<br>Serviço<br>Mensagem<br>Telefone</div>
</body>
</html>
