<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia HTML - <select></title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        h1 { color: #1f2937; }
        h2 { margin-top: 30px; color: #374151; }
        code, pre { background: #f3f4f6; padding: 3px 6px; border-radius: 4px; }
        pre { padding: 15px; overflow-x: auto; }
        .box { background: #eef6ff; padding: 15px; border-left: 4px solid #2563eb; }
    </style>
</head>
<body>
<h1>TAG <code><select></code></h1>
<div class="box"><strong>O que é?</strong><br>Cria uma lista de opções para o usuário escolher.</div>

<h2>Explicação</h2>
<div>Exemplo:<br>&lt;select id="servico" name="servico"&gt;<br>    opções<br>&lt;/select&gt;<br><br>Temas podem ter opções diferentes.<br><br>Pet Shop:<br>Banho e Tosa<br>Consulta<br>Hospedagem<br>Tosa<br><br>Academia:<br>Musculação<br>Funcional<br>Personal Trainer<br>Avaliação física<br><br>Tecnologia:<br>Formatação<br>Manutenção<br>Suporte<br>Orçamento</div>
</body>
</html>
