<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="#inicio" aria-label="EducaCão - página inicial">
            <!-- Complete o nome/identidade visual, se desejar -->
            <span class="logo-text"></span>
        </a>

        <nav class="main-nav" aria-label="Navegação principal">
            <ul>
                <li><a href="#inicio"></a></li>
                <li><a href="#servicos"></a></li>
                <li><a href="#sobre"></a></li>
                <li><a href="#contato"></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero" id="inicio">
            <div class="hero-content">
                <p class="eyebrow"></p>
                <h1></h1>
                <p class="hero-description"></p>
                <a class="button button-primary" href="#contato"></a>
            </div>
            <div class="hero-image">
                <img src="" alt="">
            </div>
        </section>

        <section class="services section" id="servicos">
            <div class="section-heading">
                <p class="eyebrow"></p>
                <h2></h2>
                <p></p>
            </div>

            <div class="service-grid">
                <article class="service-card">
                    <img src="" alt="">
                    <div class="card-content">
                        <h3></h3>
                        <p></p>
                        <a href="#contato" class="text-link"></a>
                    </div>
                </article>

                <article class="service-card">
                    <img src="" alt="">
                    <div class="card-content">
                        <h3></h3>
                        <p></p>
                        <a href="#contato" class="text-link"></a>
                    </div>
                </article>

                <article class="service-card">
                    <img src="" alt="">
                    <div class="card-content">
                        <h3></h3>
                        <p></p>
                        <a href="#contato" class="text-link"></a>
                    </div>
                </article>
            </div>
        </section>

        <section class="about section" id="sobre">
            <div class="about-image">
                <img src="" alt="">
            </div>
            <div class="about-content">
                <p class="eyebrow"></p>
                <h2></h2>
                <p></p>
                <a class="button button-secondary" href="#contato"></a>
            </div>
        </section>

        <section class="benefits section" id="diferenciais">
            <div class="section-heading">
                <p class="eyebrow"></p>
                <h2></h2>
            </div>
            <div class="benefit-grid">
                <article class="benefit-card">
                    <span class="benefit-icon" aria-hidden="true"></span>
                    <h3></h3>
                    <p></p>
                </article>
                <article class="benefit-card">
                    <span class="benefit-icon" aria-hidden="true"></span>
                    <h3></h3>
                    <p></p>
                </article>
                <article class="benefit-card">
                    <span class="benefit-icon" aria-hidden="true"></span>
                    <h3></h3>
                    <p></p>
                </article>
            </div>
        </section>

        <section class="testimonials section" id="depoimentos">
            <div class="section-heading">
                <p class="eyebrow"></p>
                <h2></h2>
                <p></p>
            </div>
            <div class="testimonial-grid">
                <article class="testimonial-card">
                    <blockquote></blockquote>
                    <p class="testimonial-author"></p>
                </article>
                <article class="testimonial-card">
                    <blockquote></blockquote>
                    <p class="testimonial-author"></p>
                </article>
            </div>
            <p class="fictional-note">Depoimentos fictícios, criados exclusivamente para esta atividade escolar.</p>
        </section>

        <section class="contact section" id="contato">
            <div class="contact-content">
                <p class="eyebrow"></p>
                <h2></h2>
                <p></p>
            </div>

            <form class="contact-form">
                <div class="form-group">
                    <label for="nome"></label>
                    <input type="text" id="nome" name="nome" placeholder="">
                </div>

                <div class="form-group">
                    <label for="email"></label>
                    <input type="email" id="email" name="email" placeholder="">
                </div>

                <div class="form-group">
                    <label for="servico"></label>
                    <select id="servico" name="servico">
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mensagem"></label>
                    <textarea id="mensagem" name="mensagem" rows="" placeholder=""></textarea>
                </div>

                <button class="button button-primary" type="submit"></button>
                <p class="form-note">Formulário demonstrativo: não envia dados sem integração com um serviço ou servidor.</p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p class="footer-brand"></p>
        <p class="footer-description"></p>
        <p class="footer-copy"></p>
    </footer>
</body>
</html>
